<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Penerimaan Mahasiswa Baru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <section class="registration-card">

      <div class="form-header">
        <span class="label">PENERIMAAN MAHASISWA BARU</span>
        <h1>Form Pendaftaran Mahasiswa Baru</h1>
        <p>Isi data berikut untuk mendaftar sebagai mahasiswa baru.</p>
      </div>

      <!-- POST dipakai karena ada password dan data pribadi.
           Action diarahkan ke endpoint backend. -->
      <form action="/api/pendaftaran" method="post">

        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama"
                 placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
                 placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="Masukkan password"
                 minlength="8" autocomplete="new-password" required>
          <small>Gunakan minimal 8 karakter.</small>
        </div>

        <div class="form-group">
          <label for="nilai">Nilai Rata-rata</label>
          <input type="number" id="nilai" name="nilai"
                 min="0" max="100" step="0.01"
                 placeholder="Contoh: 85.5" required>
        </div>

        <div class="form-group">
          <label for="tanggal-lahir">Tanggal Lahir</label>
          <input type="date" id="tanggal-lahir" name="tanggal_lahir" required>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Daftar</button>
          <button type="reset" class="btn btn-reset">Reset</button>
        </div>

      </form>

    </section>
  </main>

</body>
</html>
